name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CGO_ENABLED: "0"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Configure private temporary directory
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "i7z"
          New-Item -ItemType Directory -Force -Path $path | Out-Null
          "TMPDIR=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify release source
        run: |
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          go mod verify
          go mod tidy -diff
          go test ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
          go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -exclude=G104,G115 ./...
      - name: Install pinned SBOM generator
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
      - name: Build binaries and SBOMs
        shell: bash
        run: |
          set -euo pipefail
          mkdir artifacts
          targets=(linux/386 linux/amd64 linux/arm linux/arm64 windows/386 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64)
          for target in "${targets[@]}"; do
            os=${target%/*}
            arch=${target#*/}
            suffix=""
            if [[ "$os" == windows ]]; then suffix=".exe"; fi
            artifact="artifacts/i7z-${os}-${arch}${suffix}"
            GOOS="$os" GOARCH="$arch" go build -buildvcs=true -trimpath -o "$artifact" ./cmd/7zip
            GOOS="$os" GOARCH="$arch" cyclonedx-gomod app -json -packages -licenses \
              -main cmd/7zip -output "${artifact}.cdx.json" .
          done
          (cd artifacts && sha256sum i7z-* > SHA256SUMS)
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: artifacts/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes --verify-tag
