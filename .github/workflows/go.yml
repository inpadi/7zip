name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Configure private temporary directory
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "i7z"
          New-Item -ItemType Directory -Force -Path $path | Out-Null
          "TMPDIR=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install upstream compatibility oracle
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes 7zip
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/7zip
      - name: Verify module graph is reproducible
        if: runner.os == 'Linux'
        run: |
          go mod verify
          go mod tidy -diff
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Vulnerability scan
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Security static analysis
        if: runner.os == 'Linux'
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -exclude=G104,G115 ./...
