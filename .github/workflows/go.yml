name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install upstream compatibility oracle
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes 7zip
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/7zip
